name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-repo
        with:
          cache: true

      # Same set as `bun run ci` (the pre-push hook) — keep them in sync so a
      # green push can't go red here. Split into steps for per-step annotations.
      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun run test

      - name: i18n dead keys
        run: bun run i18n:check

      - name: Dead code (knip)
        run: bun run deadcode

      - name: Secrets scan
        run: bun run secrets:scan

      - name: Expo config doctor
        run: bunx expo-doctor

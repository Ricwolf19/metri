name: EAS Update (OTA)

# Publishes an over-the-air JS update on every push to main, so changes that
# do not touch native code reach installed builds without a new store release.

on:
  push:
    branches: [main]

concurrency:
  group: eas-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: Publish OTA update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard EXPO_TOKEN
        id: guard
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "EXPO_TOKEN not set — skipping OTA update."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/setup-repo
        if: ${{ steps.guard.outputs.skip != 'true' }}
        with:
          cache: true

      - name: Setup EAS
        if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # `--channel`, not `--auto`. `--auto` publishes to an EAS branch named
      # after the git branch (`main`), but EAS links a channel to a branch of
      # the SAME name — so the `beta` channel that the sideloaded APK listens on
      # would never see updates pushed to `main`. Targeting the channel lets EAS
      # resolve the branch on its side.
      #
      # EXPO_PUBLIC_AUTH_URL pins the API origin during config evaluation. This
      # runner sets no NODE_ENV, and app.config.ts must resolve the same
      # `extra.apiUrl` here as on the EAS builder (eas.json sets the same env) —
      # the first beta APK shipped pointing at the emulator's localhost because
      # these contexts disagreed.
      - name: Publish update
        if: ${{ steps.guard.outputs.skip != 'true' }}
        env:
          EXPO_PUBLIC_AUTH_URL: https://metri.info
        run: |
          eas update --channel beta --non-interactive \
            --message "$(git log -1 --pretty=%s)"
